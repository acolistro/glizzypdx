name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Must run BEFORE actions/setup-node — pnpm needs to exist on the
      # runner before setup-node's `cache: pnpm` option can detect it and
      # find the lockfile to key the cache off of. Version is read from
      # package.json's "packageManager" field automatically, so it stays
      # in sync with what's actually used locally without hardcoding a
      # version number here too (one source of truth instead of two).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Reads the version from .nvmrc instead of hardcoding it here —
          # keeps CI and local dev on the exact same Node version with one
          # file to update instead of two drifting out of sync.
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails the install instead of silently updating
        # pnpm-lock.yaml if it's out of sync with package.json — CI should
        # never modify the lockfile, only verify it's correct.
        run: pnpm install --frozen-lockfile

      # TanStack Router's file-based routing normally generates
      # src/routeTree.gen.ts automatically via its Vite plugin, the
      # moment `vite dev` or `vite build` runs. But `tsc -b` below runs
      # standalone — it never invokes Vite — so on a fresh CI checkout
      # (no leftover generated file from a previous local `pnpm dev`),
      # type-checking fails immediately with "cannot find module
      # './routeTree.gen'". `tsr generate` (from @tanstack/router-cli)
      # runs the same route-tree generation logic standalone, without
      # needing a dev server or full build first — so we run it here,
      # before anything that depends on types resolving correctly.
      - name: Generate route tree
        run: pnpm generate-routes

      - name: Lint
        run: pnpm lint

      - name: Type check
        # `tsc -b` (build mode), not `tsc --noEmit` — this project uses
        # TypeScript project references (tsconfig.json points to
        # tsconfig.app.json + tsconfig.node.json), which -b understands
        # and --noEmit alone does not resolve correctly. noEmit is already
        # set inside both referenced tsconfigs, so this only type-checks,
        # it doesn't write any output files.
        run: pnpm exec tsc -b

      - name: Run unit tests with coverage
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
        run: pnpm coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    # PR-only, mirroring the e2e job: main is protected (PRs required), so
    # PR-time is the gate that matters. No need to re-run on the post-merge
    # push to main.
    if: github.event_name == 'pull_request'
    # Don't spin up Docker if lint / type-check / unit tests are already
    # broken — cheaper to fail fast in the light job first.
    needs: lint-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs the standalone `supabase` CLI binary (Go, not npm) so we can
      # run a REAL local stack via Docker — same as `supabase start` locally.
      #
      # Pinned (GLPDX-179): `version: latest` let CI silently drift onto a
      # newer CLI than local dev. Confirmed via local repro that CLI 2.116.0
      # grants EXECUTE on delete_expired_opted_out_checkins() to anon/
      # authenticated by default, where 2.109.0 (this pin) does not. Bump
      # deliberately via the dependabot.yml PR, not by editing this back to
      # `latest`.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      # Starts Postgres + Auth (+ the rest) as Docker containers and applies
      # this repo's migrations. That is all the integration harness needs —
      # tests talk to Postgres/Auth directly via the service_role/anon clients;
      # no Edge Functions `serve` and no app build are required here (that's
      # the e2e job's concern, not this one).
      #
      # NOTE: this job deliberately does NOT seed the admin account. That
      # account exists only for the E2E admin login flow (GLPDX-124); the
      # integration harness creates its own throwaway users per test via
      # createAuthedTestUser().
      - name: Start local Supabase
        run: supabase start

      # The integration harness (GLPDX-162) reads NON-VITE_ vars. Pull the
      # running stack's keys at runtime and expose them to the test process via
      # $GITHUB_ENV. The URL is deterministic (port from config.toml), so it's
      # hardcoded; the keys are read dynamically rather than pasted in.
      - name: Export local Supabase credentials
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      # --passWithNoTests lives in the script itself; this stays green on PRs
      # that add no integration files (e.g. the harness PR).
      - name: Run integration tests
        run: pnpm test:integration

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same reasoning as the lint-and-test job above: `pnpm e2e` runs
      # Playwright, whose webServer builds the app via `pnpm build`
      # (tsc -b && vite build). The `tsc -b` half of that chain would
      # fail on a fresh checkout for the same missing-routeTree.gen.ts
      # reason, before `vite build` ever gets a chance to generate it
      # via the plugin. Generating it explicitly here, up front, avoids
      # depending on step ordering inside that build script.
      - name: Generate route tree
        run: pnpm generate-routes

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # backend to actually talk to.
      #
      # Pinned (GLPDX-179) — see integration job above for the full note.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      # Starts the full local stack (Postgres + Auth + Storage + Edge
      # Functions runtime) as Docker containers, using this repo's
      # supabase/config.toml and migrations — same command as local dev.
      # GitHub's ubuntu-latest runners have Docker preinstalled, so no
      # separate Docker setup step is needed.
      - name: Start local Supabase
        run: supabase start

      # admin-auth.spec.ts (GLPDX-124) logs in as a real admin account,
      # which doesn't exist on a fresh stack. Same script used locally.
      # Env vars are passed inline rather than via $GITHUB_ENV because
      # $GITHUB_ENV only affects *subsequent* steps, not this one, and
      # rather than --env-file because .env.local is gitignored — CI has
      # no copy of it. Key is read from the running stack, same pattern
      # as the integration job's credential export.
      - name: Seed local admin account for E2E
        run: LOCAL_SUPABASE_URL=http://127.0.0.1:54321 LOCAL_SUPABASE_SECRET_KEY="$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" node --import tsx scripts/admin/seed-local-admin.ts

      - name: Create supabase/functions/.env for local Edge Functions
        run: echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" > supabase/functions/.env

      # supabase/functions/.env holds the dummy Turnstile secret (see
      # GLPDX-129) — same file used for local dev, checked into git
      # ONLY as far as this dummy/public-safe test value goes (never a
      # real secret). Runs in the background (&) since `functions serve`
      # is a long-running foreground process; we capture its PID to stop
      # it cleanly in the cleanup step below, and redirect output to a
      # log file so it doesn't interleave confusingly with the E2E test
      # output but is still available if we need to debug a failure.
      - name: Serve Edge Functions locally
        run: |
          supabase functions serve --env-file supabase/functions/.env > functions-serve.log 2>&1 &
          echo "FUNCTIONS_SERVE_PID=$!" >> "$GITHUB_ENV"
          # Give the Edge Functions runtime a moment to actually start
          # listening before the build/E2E run tries to hit it.
          sleep 5

      # .env.test is gitignored (same reasoning as .env — even though
      # these are non-sensitive/dummy values today, keeping the pattern
      # consistent means a future contributor can't accidentally commit
      # a real secret into this file out of habit). CI writes its own
      # copy fresh each run.
      #
      # VITE_SUPABASE_PUBLISHABLE_KEY is read from the running stack rather than
      # hardcoded. It used to be the well-known legacy demo JWT, but the
      # CLI now issues publishable keys (sb_publishable_...) instead, and
      # a hardcoded legacy key no longer matches what Auth accepts —
      # which broke the admin login E2E tests while leaving the inquiry
      # tests green (those go through an Edge Function, not Auth
      # directly). Reading it dynamically means this can't drift again
      # the next time the CLI changes its key format.
      - name: Create .env.test for E2E build
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> .env.test
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> .env.test
          echo "VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> .env.test

      - name: Run E2E tests against local production build
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Edge Functions log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-serve-log
          path: functions-serve.log
          retention-days: 14

      # Runs even if earlier steps failed, so a failing E2E run doesn't
      # leave orphaned Docker containers / background processes on the
      # runner. GitHub Actions runners are ephemeral and torn down after
      # every job regardless, so this is more about a clean job log /
      # good practice than strictly necessary — but it's cheap insurance.
      - name: Stop Edge Functions and local Supabase
        if: always()
        run: |
          if [ -n "$FUNCTIONS_SERVE_PID" ]; then kill "$FUNCTIONS_SERVE_PID" || true; fi
          supabase stop